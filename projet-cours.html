<!DOCTYPE html>
<!--
  projet-cours.html — Vue générique d'UN cours d'une formation à étapes.
  Le projet, la formation et le cours viennent de l'URL : ?p=<projet>&s=<section>&c=<numéro>
  (ex. projet-cours.html?p=formations&s=dd-data-engineering&c=03). En tête, la
  carte de la formation en miniature, à droite des titres ; dessous, les étapes
  du labo et les cours voisins. Tout est rempli par js/content.js (rendreCours).
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iAlexMG</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="projet-649">
  <header class="entete" id="entete"></header>

  <main>
    <section class="entete-page entete-cours">
      <div class="conteneur">
        <nav class="fil-ariane" data-fil-ariane aria-label="Fil d'Ariane"></nav>
        <!-- La carte en miniature flotte à droite : le rang, le titre, le
             résumé et les documents coulent à sa gauche. -->
        <div data-cours-mini></div>
        <p class="cours-rang" data-cours-rang></p>
        <h1 data-section-titre></h1>
        <p class="accroche" data-section-intro></p>
        <p class="fiche-docs" data-cours-docs hidden></p>
      </div>
    </section>

    <section class="section" style="padding-top:0;">
      <div class="conteneur">
        <div data-projet-cours data-page-section="projet-section.html" data-page-cours="projet-cours.html"></div>
      </div>
    </section>
  </main>

  <footer class="pied" id="pied"></footer>

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/components.js"></script>
  <script src="js/content.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
