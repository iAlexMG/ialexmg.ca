<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Façade à colonnes d'une bourse américaine">
  <!-- Miniature d'accueil « Indices boursiers » — la façade à colonnes d'une
       bourse, trois étoiles au fronton pour les États-Unis. Générique, sans
       texte, aux couleurs du site. Le motif tient dans les 800 px du centre :
       la carte Trading de l'accueil n'en montre que la moitié centrale. -->
  <rect width="1600" height="900" fill="#0B0E14"/>

  <!-- Fronton -->
  <path d="M 560 335 L 800 215 L 1040 335 Z"
        fill="#12161C" stroke="#E3B341" stroke-width="6" stroke-linejoin="round"/>
  <g fill="#E3B341">
    <polygon points="755.0,275.0 759.1,286.3 771.2,286.7 761.7,294.2 765.0,305.8 755.0,299.0 745.0,305.8 748.3,294.2 738.8,286.7 750.9,286.3"/>
    <polygon points="800.0,275.0 804.1,286.3 816.2,286.7 806.7,294.2 810.0,305.8 800.0,299.0 790.0,305.8 793.3,294.2 783.8,286.7 795.9,286.3"/>
    <polygon points="845.0,275.0 849.1,286.3 861.2,286.7 851.7,294.2 855.0,305.8 845.0,299.0 835.0,305.8 838.3,294.2 828.8,286.7 840.9,286.3"/>
  </g>

  <!-- Entablement -->
  <rect x="545" y="335" width="510" height="38" rx="3"
        fill="#12161C" stroke="#E3B341" stroke-width="6"/>

  <!-- Colonnes -->
  <g fill="#223042">
    <rect x="585" y="390" width="36" height="220" rx="3"/>
    <rect x="664" y="390" width="36" height="220" rx="3"/>
    <rect x="743" y="390" width="36" height="220" rx="3"/>
    <rect x="821" y="390" width="36" height="220" rx="3"/>
    <rect x="900" y="390" width="36" height="220" rx="3"/>
    <rect x="979" y="390" width="36" height="220" rx="3"/>
  </g>

  <!-- Marches -->
  <rect x="545" y="622" width="510" height="24" rx="3" fill="#12161C" stroke="#E3B341" stroke-width="6"/>
  <rect x="510" y="660" width="580" height="24" rx="3" fill="#12161C" stroke="#E3B341" stroke-width="6"/>
</svg>
